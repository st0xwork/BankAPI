name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      BACKEND_URL: http://localhost:4111/api
      DATA_BASE_URL: sqlite+pysqlite:///:memory:
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ci-placeholder

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Check Python modules
        run: python -m compileall -q src

      - name: Collect API tests
        run: pytest src/main/api/tests -m api --collect-only -q -p no:cacheprovider

      - name: Run UI tests
        run: pytest src/main/ui/tests -m ui -q --alluredir=allure-results

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
